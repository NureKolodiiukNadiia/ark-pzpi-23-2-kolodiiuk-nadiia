[server]
host = "https://api.your-smart-home.com"

[lock]
check_interval_sec = 3 # How often to poll the server for commands
mechanism = "simulated" # Options: "simulated", "gpio" (for Raspberry Pi), "serial"

# Configuration for a simulated lock mechanism
[lock.simulated]
event_probability = 0.2 # Chance of simulating an NFC tap each loop

# Configuration for a real GPIO-based lock (e.g., on a Raspberry Pi)
[lock.gpio]
lock_pin = 17
unlock_delay_ms = 1000
